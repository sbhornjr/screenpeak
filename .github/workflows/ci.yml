name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm test -w @screenpeak/mobile
      - run: node --test '.cursor/skills/verify-screenpeak/test/*.test.mjs'
      - run: R2_PUBLIC_URL=https://ci.example npx next typegen
        working-directory: apps/web
      - run: npx tsc --noEmit -p apps/web
      - run: npx tsc --noEmit -p apps/mobile
      - run: npx tsc --noEmit -p packages/shared
